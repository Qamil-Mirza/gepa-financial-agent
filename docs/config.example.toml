# PitStop user config (example).
#
# Copy this file to ~/.pitstop/config.toml (or $PITSTOP_HOME/config.toml if you set PITSTOP_HOME)
# and edit. It holds no keys or secrets: API keys stay in environment variables.

# Hard dollar budget for everything sent to Crusoe, including PitStop's own calls
# (research swarm, supervisor/judge, GEPA, trace generator). Once $50 has been spent in
# total, the next call raises BudgetExceeded before it reaches the provider.
[budgets.crusoe]
base_url = "https://api.inference.crusoecloud.com/v1"
limit_usd = 50
period = "total"        # one of the periods PitStop accepts, "total" = lifetime

# A budget for Anthropic (pitstop.wrap(Anthropic())); the SDK's default base_url is shown.
# [budgets.anthropic]
# base_url = "https://api.anthropic.com"
# limit_usd = 20
# period = "total"

# Optional price override per model, in USD per million tokens. Unknown models are priced
# conservatively until you add an entry like this one.
# [prices."vendor/model-name"]
# input = 0.10
# output = 0.40
# cached_input = 0.05

# Claude models without an entry are priced at a conservative $15 input / $75 output per million
# tokens. Copy the current prices for the model you use from the provider's pricing page
# (https://www.anthropic.com/pricing); the numbers below are placeholders, not real prices.
# [prices."claude-model-name"]
# input = 3.00
# output = 15.00
# cached_input = 0.30

# The judge for the L1 pre-action gate: before a side_effects=True tool runs in a high or medium
# workflow, this model is asked whether the call serves the goal (~0.5-1.5 s per gated call; its
# calls count against the budgets above). These are the defaults; omit the table to keep them.
# Only the NAME of the env var holding the key goes here, never the key. With no key set (and no
# pitstop.init(judge_client=...)), gated calls follow on_gate_error: high workflows block them,
# medium workflows run them.
# [judge]
# model = "openai/gpt-oss-120b"
# base_url = "https://api.inference.crusoecloud.com/v1"
# api_key_env = "CRUSOE_API_KEY"
# timeout_s = 10.0
