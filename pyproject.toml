[project]
name = "pitstop"
version = "0.1.0.dev0"
description = "Drift detection, urgency labels and prompt correction for LLM agent workflows"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "openai>=1.60",
    "httpx>=0.27",
    "rich>=13",
    "python-dotenv>=1.0",
    "gepa==0.1.4",
    "cloudpickle>=3.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=2.0"]
otel = ["opentelemetry-api>=1.45", "opentelemetry-sdk>=1.45"]

[project.scripts]
pitstop = "pitstop.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "pytest-socket>=0.7", "ruff>=0.6", "anthropic>=2.0",
       "opentelemetry-api>=1.45", "opentelemetry-sdk>=1.45", "pitstop-financial-research"]

[tool.uv.workspace]
members = ["examples/financial-research"]

[tool.uv.sources]
pitstop-financial-research = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pitstop"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--disable-socket --allow-unix-socket --allow-hosts=127.0.0.1,localhost"
pythonpath = [".", "benchmarks/synth"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["F"]
