name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run pytest -q

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm --prefix ui ci
      - run: npm --prefix ui run typecheck
      - run: npm --prefix ui test -- --run
      - run: npm --prefix ui run build
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      # the wheel must ship the built dashboard (a hatch artifact: git-ignored, so only present after the build)
      - run: uv build --wheel -o "$RUNNER_TEMP/wheel"
      - run: >-
          python3 -c "import glob, os, zipfile;
          wheels = glob.glob(os.path.join(os.environ['RUNNER_TEMP'], 'wheel', '*.whl'));
          assert len(wheels) == 1, wheels;
          names = zipfile.ZipFile(wheels[0]).namelist();
          assert 'pitstop/server/static/index.html' in names, 'the wheel has no pitstop/server/static/index.html';
          print(wheels[0], 'ships the dashboard')"
