[project]
name = "pitstop-financial-research"
version = "0.1.0.dev0"
description = "PitStop example: a multi-agent financial research swarm with drift injection, a per-step supervisor and the GEPA demo page"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "pitstop",
    "pydantic>=2.7",
    "httpx>=0.27",
    "rich>=13",
    "python-dotenv>=1.0",
]

[project.scripts]
finresearch = "finresearch.cli:main"

[tool.uv.sources]
pitstop = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["finresearch"]
