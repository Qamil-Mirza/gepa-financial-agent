[project]
name = "pitstop"
version = "0.1.0.dev0"
description = "PitStop: a GEPA-optimized, task-scoped drift supervisor for multi-agent research swarms"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "openai>=1.60",
    "httpx>=0.27",
    "rich>=13",
    "python-dotenv>=1.0",
    "gepa==0.1.4",
    "cloudpickle>=3.0",
]

[project.scripts]
pitstop = "pitstop.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "pytest-socket>=0.7", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# gepa_financial_agent stays packaged only until the old stack is folded in / removed (M1 Tasks 3-5).
packages = ["src/pitstop", "gepa_financial_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
